name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [release, asan]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (release)
        if: matrix.mode == 'release'
        run: make

      - name: Build (AddressSanitizer + UBSan)
        if: matrix.mode == 'asan'
        run: make asan

      - name: Run test suite
        run: python3 tests/test_runner.py

  guide:
    name: guide is in sync with the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs/assets/source-data.js
        run: python3 tools/guide/build.py --check
